# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    # A template update replaces the root manifests, so version PRs here do not
    # last. Security alerts still appear.
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@sindresorhus/slugify"
        # For slugify, ignore all updates.
        
  # Browser libraries for the cdn-integrity plugin. Major versions stay in
  # separate PRs because each one needs its own browser test.
  - package-ecosystem: "npm"
    directory: "/src/plugins/cdn-integrity"
    schedule:
      interval: "weekly"
    ignore:
      # No note uses diagrams, so a major update is not worth a browser test.
      # Security alerts for Mermaid still appear.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
      # FlexSearch 0.8 is labelled minor, but 0.x releases can break the API.
      - dependency-name: "flexsearch"
        versions: [">=0.8.0"]
    groups:
      browser-libraries:
        update-types:
          - "minor"
          - "patch"
